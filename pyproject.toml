[tool.poetry]
name = "vie-en-rose-analytics"
version = "0.1.0"
description = "Projet d'analyse de données pour le commerce de détail"
authors = []
readme = "README.md"
packages = [{ include = "vie_en_rose_analytics", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
beautifulsoup4 = "^4.13"
dash = "^3.0"
mysql-connector-python = "^9.0"
pandas = "^2.2"
python-dotenv = "^1.0"
requests = "^2.32"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
